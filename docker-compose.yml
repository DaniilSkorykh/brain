services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # Локальный режим: сервер хранит файлы на томе и отдаёт абсолютные пути
      # (лимит скачивания до 2 ГБ вместо 20 МБ у облачного API).
      TELEGRAM_LOCAL: 1
    volumes:
      - tg_bot_api:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file: .env
    environment:
      # Кеш моделей HuggingFace (e5) — в постоянном томе, чтобы не качать ~1 ГБ
      # заново при каждой пересборке/перезапуске контейнера.
      HF_HOME: /app/hf_cache
      # Часовой пояс — для расписаний дайджестов и логов.
      TZ: Europe/Moscow
    volumes:
      - ./knowledge:/app/knowledge
      - ./db:/app/db
      - chroma_data:/app/chroma_db
      - hf_cache:/app/hf_cache
      # Тот же том, что у Bot API — чтобы бот читал скачанные файлы по их пути.
      - tg_bot_api:/var/lib/telegram-bot-api
    ports:
      - "8443:8443"

  # Синхронизация knowledge/ministry ↔ папка «Молодежное служение и проекты» на ПК.
  # Панель управления — только с самого сервера (ssh -L 8384:127.0.0.1:8384).
  syncthing:
    image: syncthing/syncthing:latest
    restart: unless-stopped
    hostname: brain-vps
    environment:
      # root — чтобы править файлы, которые создаёт бот (он тоже работает от root)
      PUID: 0
      PGID: 0
      TZ: Europe/Moscow
    volumes:
      - syncthing_config:/var/syncthing/config
      - ./knowledge/ministry:/data/ministry
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
    mem_limit: 200m

volumes:
  chroma_data:
  hf_cache:
  tg_bot_api:
  syncthing_config:
